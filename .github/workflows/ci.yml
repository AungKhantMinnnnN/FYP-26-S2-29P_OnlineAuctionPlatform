name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-lint-and-test-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auction_test
          POSTGRES_USER: auction_user
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      # Non-blocking: ruff has never actually run before (previously missing from
      # requirements-dev.txt, so this step failed with "command not found" every time
      # rather than reporting real findings). With no ruff config in the repo, the
      # default rule set now surfaces ~590 pre-existing findings. Surface them without
      # blocking the pipeline; flip to blocking once that backlog is triaged.
      - name: Run linter
        run: ruff check backend/
        continue-on-error: true

      # Same story as ruff, plus backend/app had no __init__.py files (implicit
      # namespace packages), which made mypy's default resolver treat same-named
      # files in different dirs (e.g. schemas/admin.py vs controller/admin.py) as a
      # single ambiguous module and abort immediately. Running from backend/ (like
      # the pytest step below) plus real __init__.py files fixes resolution; ~207
      # real findings remain (mostly Column[X] vs X — SQLAlchemy Mapped[] typing
      # debt), non-blocking for the same reason as ruff above.
      - name: Run type checker
        run: cd backend && mypy app
        continue-on-error: true

      - name: Run tests (backend)
        env:
          DATABASE_URL: postgresql://auction_user:testpassword@localhost:5432/auction_test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
        run: cd backend && pytest tests/ -v --tb=short

      - name: Run tests (bidding-engine)
        run: |
          pip install -r bidding-engine/requirements.txt -r bidding-engine/requirements-dev.txt
          cd bidding-engine && pytest tests/ -v --tb=short

      - name: Run tests (recommendation-engine)
        run: |
          pip install -r recommendation-engine/requirements.txt -r recommendation-engine/requirements-dev.txt
          cd recommendation-engine && pytest tests/ -v --tb=short

  frontend-lint-and-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-frontend-lint-and-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Non-blocking: the codebase currently has ~63 pre-existing lint errors (mostly
      # no-explicit-any). Surface them without failing the build; flip to blocking
      # once that backlog is cleared.
      - name: Run linter
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  integration-tests:
    name: Integration tests (real DB + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-integration-tests-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auction_test
          POSTGRES_USER: auction_user
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # init.sql is the base schema; scripts/apply_migrations.py then replays every file
      # under scripts/migrations/ (each one is self-guarded to be safely re-runnable) so
      # the drift tests check against the actual current schema, not a hand-picked subset.
      - name: Load schema
        env:
          PGPASSWORD: testpassword
          DATABASE_URL: postgresql://auction_user:testpassword@localhost:5432/auction_test
        run: |
          psql -h localhost -U auction_user -d auction_test -v ON_ERROR_STOP=1 -f docker/postgres/init.sql
          python3 scripts/apply_migrations.py

      - name: Install dependencies (all services)
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          pip install -r bidding-engine/requirements.txt -r bidding-engine/requirements-dev.txt
          pip install -r recommendation-engine/requirements.txt -r recommendation-engine/requirements-dev.txt

      - name: Integration — backend (schema drift)
        env:
          DATABASE_URL: postgresql+asyncpg://auction_user:testpassword@localhost:5432/auction_test
        run: cd backend && pytest integration/ -v --tb=short

      - name: Integration — recommendation-engine (schema drift)
        env:
          DATABASE_URL: postgresql+asyncpg://auction_user:testpassword@localhost:5432/auction_test
        run: cd recommendation-engine && pytest integration/ -v --tb=short

      # INTEGRATION_DATABASE_URL makes the harness skip local docker provisioning and use the
      # ephemeral CI database directly (it's isolated per run, so writes are fine).
      - name: Integration — bidding-engine (concurrency, escrow, drift)
        env:
          DATABASE_URL: postgresql+asyncpg://auction_user:testpassword@localhost:5432/auction_test
          INTEGRATION_DATABASE_URL: postgresql+asyncpg://auction_user:testpassword@localhost:5432/auction_test
          REDIS_URL: redis://localhost:6379/0
        run: cd bidding-engine && pytest integration/ -v --tb=short

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-docker-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Build Postgres image
        run: docker build ./docker/postgres -t auction-postgres:ci
      # Every service's env_file: is ${ENV_FILE:-.env.local}, not .env — copying to
      # .env alone left that unresolved and compose failed with "env file .../.env.local
      # not found". --env-file .env.local covers both that and ${VAR} interpolation
      # (e.g. ${POSTGRES_DB}) in one file.
      - name: Compose up smoke test
        run: |
          cp .env.example .env.local
          docker compose --env-file .env.local up -d --wait
          docker compose --env-file .env.local ps
          docker compose --env-file .env.local down

  # A deploy-staging job used to live here (self-hosted runner, ENV_FILE pointing at
  # /opt/auctionhub/env/.env.staging). That path was never actually provisioned on the
  # VM, so the job failed on every push to development without protecting a real staging
  # environment. Removed rather than left dead; .env.staging.example still documents the
  # env shape for whoever stands staging up for real. Deployment to the VM lives in
  # deploy.yml (triggers on the same push-to-development event, runs deploy_auction.sh on
  # the self-hosted runner) — not duplicated here. main is intentionally not deployed
  # anywhere — CI still runs on it (see the `on:` triggers above) so PRs into main are
  # still gated, it just never reaches a server.
