name: Deploy to VM

on:
  push:
    branches: [development]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy development to VM
    runs-on: [self-hosted, vm]
    timeout-minutes: 15
    steps:
      - name: Run deploy script
        run: sudo /usr/local/bin/deploy_auction.sh
