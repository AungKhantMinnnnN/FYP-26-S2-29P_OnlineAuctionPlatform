services:

  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: auction-postgres:local
    container_name: AuctionHub_PostgreSQL_DB${STACK_SUFFIX:-}
    env_file: ${ENV_FILE:-.env.local}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DOCKER_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    image: auction-redis:local
    container_name: AuctionHub_Redis${STACK_SUFFIX:-}
    env_file: ${ENV_FILE:-.env.local}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${DOCKER_BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-init:
    image: redis:7-alpine
    container_name: AuctionHub_Redis_Init${STACK_SUFFIX:-}
    env_file: ${ENV_FILE:-.env.local}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./docker/redis/init-redis.sh:/init-redis.sh
    entrypoint: /bin/sh /init-redis.sh
    restart: "no"

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: AuctionHub_MinIO_DB${STACK_SUFFIX:-}
    env_file: ${ENV_FILE:-.env.local}
    command: server /data --console-address ":9001"
    ports:
      - "${DOCKER_BIND_ADDR:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: AuctionHub_MinIO_Init${STACK_SUFFIX:-}
    env_file: ${ENV_FILE:-.env.local}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./docker/minio/init-buckets.sh:/init-buckets.sh
    entrypoint: /bin/sh /init-buckets.sh
    restart: "no"

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        VITE_API_URL: /v1.0.0
        VITE_RECS_URL: /v1.0.0
    image: auction-nginx:local
    container_name: AuctionHub_Nginx${STACK_SUFFIX:-}
    ports:
      - "${NGINX_PORT:-80}:80"   # all browser traffic enters here — the only port meant to be reachable from outside the Tailscale network
    depends_on:
      - backend
      - bidding-engine
      - recommendation-engine
    restart: unless-stopped

  # Public hosting: a Cloudflare Quick Tunnel — no account, no domain, no inbound firewall
  # rule needed (outbound-only connection to Cloudflare's edge). Reaches nginx over the
  # internal Docker network, not the host's published port. Trade-off: the assigned
  # *.trycloudflare.com hostname changes every time this container restarts — check its
  # logs (`docker logs AuctionHub_CloudflareTunnel`) for the current URL. For a stable,
  # permanent hostname, swap this for a named tunnel against a domain added to Cloudflare
  # (`cloudflared tunnel create` + `cloudflared tunnel route dns`) instead.
  cloudflared:
    image: cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    container_name: AuctionHub_CloudflareTunnel${STACK_SUFFIX:-}
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx
    restart: unless-stopped

  # ── Microservices ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: auction-backend:local
    container_name: AuctionHub_API${STACK_SUFFIX:-}
    env_file: ${ENV_FILE:-.env.local}
    environment:
      PROJECT_NAME: "AuctionHub - API Gateway"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      LOG_DIR: /logs
      ALL_LOGS_DIR: /all-logs
    ports:
      - "${DOCKER_BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./logs/backend:/logs
      - ./logs:/all-logs:ro   # read-only view of every service's logs for the admin System Logs view
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  bidding-engine:
    build:
      context: ./bidding-engine
      dockerfile: Dockerfile
    image: auction-bidding-engine:local
    container_name: AuctionHub_BiddingEngine_Microservice${STACK_SUFFIX:-}
    env_file: ${ENV_FILE:-.env.local}
    environment:
      PROJECT_NAME: "AuctionHub - Bidding-Engine"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BACKEND_URL: http://backend:8000
      LOG_DIR: /logs
    ports:
      - "${DOCKER_BIND_ADDR:-127.0.0.1}:${BIDDING_PORT:-8001}:8001"   # health check + WebSocket
    volumes:
      - ./logs/bidding-engine:/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    restart: unless-stopped

  recommendation-engine:
    build:
      context: ./recommendation-engine
      dockerfile: Dockerfile
    image: auction-recommendation-engine:local
    container_name: AuctionHub_RecommendationEngine_Microservice${STACK_SUFFIX:-}
    env_file: ${ENV_FILE:-.env.local}
    environment:
      PROJECT_NAME: "AuctionHub - Recommendation Engine"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BACKEND_URL: http://backend:8000
      LOG_DIR: /logs
    ports:
      - "${DOCKER_BIND_ADDR:-127.0.0.1}:${RECS_PORT:-8002}:8002"   # health check endpoint
    volumes:
      - ./logs/recommendation-engine:/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data: