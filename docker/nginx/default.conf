limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=bids:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# All public traffic arrives via the Cloudflare Tunnel, which connects to nginx over this
# compose project's internal bridge network (cloudflared talks to http://nginx:80 directly,
# never through the published host port). That means any connection whose *real* source
# (pre-realip) isn't inside this subnet did NOT come through Cloudflare -- e.g. anyone hitting
# the VM's port 80 directly. Only trust CF-Connecting-IP / X-Forwarded-Proto from the former;
# a direct connection can't spoof its own TCP source address, so this is safe even though the
# host port itself is still publicly reachable.
set_real_ip_from 172.18.0.0/16;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

geo $realip_remote_addr $trusted_cf_proxy {
    default 0;
    172.18.0.0/16 1;
}

map $trusted_cf_proxy:$http_x_forwarded_proto $client_proto {
    "1:https" https;
    default http;
}

upstream backend {
    server backend:8000;
}

upstream bidding_engine {
    server bidding-engine:8001;
}

upstream recommendation_engine {
    server recommendation-engine:8002;
}

upstream minio {
    server minio:9000;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Nginx defaults to 1MB, which rejects any real video/image upload with a 413
    # before it ever reaches the backend. Marketing videos in particular can be large.
    client_max_body_size 200M;

    # Bidding Engine WebSocket (must come before the /v1.0.0/bids/ REST block below —
    # nginx matches the longest prefix, so this wins for ws upgrade requests)
    location /v1.0.0/bids/ws/ {
        proxy_pass http://bidding_engine;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    # Bidding Engine REST & Swagger Docs
    location /v1.0.0/bids/ {
        limit_req zone=bids burst=40 nodelay;
        proxy_pass http://bidding_engine;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    # Block internal notification endpoints from the public internet
    location /v1.0.0/internal/ {
        return 404;
    }

    # Auth endpoints — tighter rate limit than the general API zone
    location /v1.0.0/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    # Backend Core & Swagger Docs
    location /v1.0.0/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    # Recommendation Engine REST & Swagger Docs
    location /v1.0.0/recs/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://recommendation_engine;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_proto;
    }

    # Also route /trending specifically to Recommendation Engine
    location /v1.0.0/trending {
        proxy_pass http://recommendation_engine/v1.0.0/recs/trending;
        proxy_set_header Host $host;
    }

    # Listing images — MinIO isn't published on the host anymore, proxy it instead
    location /auction-assets/ {
        proxy_pass http://minio/auction-assets/;
    }

    # User avatars — same reasoning as auction-assets above
    location /auction-avatars/ {
        proxy_pass http://minio/auction-avatars/;
    }

    # Marketing hero video — same reasoning as auction-assets above. Without this,
    # the presigned URL returned by the backend points at the internal Docker
    # hostname "minio", which the browser can't resolve, so playback fails even
    # after a successful upload.
    location /auction-videos/ {
        proxy_pass http://minio/auction-videos/;
    }

    location /health {
        return 200 '{"status":"UP"}';
        add_header Content-Type application/json;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
